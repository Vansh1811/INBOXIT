version: "3.8"

services:
  server:
    image: vanssh1811/inboxit-server:latest   # ✅ use pushed image
    container_name: inboxit-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production

  client:
    image: vanssh1811/inboxit-client:latest   # ✅ use pushed image
    container_name: inboxit-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000   # important for frontend

networks:
  default:
    name: inboxit-network   # ✅ fixed indentation